runtime: nodejs24
service: ##_SERVICE##
automatic_scaling:
  max_instances: 1
handlers:
  - url: /.*
    script: auto
    secure: always
env_variables:
  profile: ##_PROFILE##
  adminElevatedPrivileges: ##_ADMINELEVATEDPRIVILEGES##
  mongodbUri: ##_MONGOURI##
  smtpHost: ##_SMTPHOST##
  smtpUser: ##_SMTPUSER##
  smtpPass: ##_SMTPPASS##
  smtpPort: '##_SMTPPORT##'
  smtpSecure: '##_SMTPSECURE##'
  smtpFrom: '##_SMTPFROM##'
  sessionKey: ##_SESSIONKEY##
  minioEndPoint: ##_MINIOENDPOINT##
  minioUseSSL: ##_MINIOSSL##
  minioAccessKey: ##_MINIOACCESSKEY##
  minioSecretKey: ##_MINIOSECRETKEY##
  minioBucket: ##_MINIOBUCKET##
  appVersion: '##_APPVERSION##'
