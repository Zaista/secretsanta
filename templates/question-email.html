<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secret Santa Question</title>
  </head>
  <!-- inline styles and table layout only: many email clients drop <style> blocks and modern CSS -->
  <body style="margin: 0; padding: 0; background-color: #f4f4f4">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f4f4f4"
    >
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border: 1px solid #dddddd;
              border-bottom: 2px solid #009879;
              font-family: Arial, Helvetica, sans-serif;
              font-size: 14px;
              line-height: 1.5;
              color: #212529;
            "
          >
            <tr>
              <td>
                <img
                  src="https://secretsanta.jovanilic.com/resources/images/santa.jpg"
                  alt="Secret Santa"
                  width="600"
                  style="
                    display: block;
                    width: 100%;
                    max-width: 600px;
                    height: auto;
                    border: 0;
                  "
                />
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 24px 8px">
                Somebody from the Secret Santa group
                <strong id="group-placeholder">{{groupName}}</strong> asked you
                a question:
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 24px">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 14px;
                    color: #212529;
                  "
                >
                  <tr>
                    <td
                      style="
                        padding: 12px 16px;
                        background-color: #f8f9fa;
                        border: 1px solid #dddddd;
                        border-left: 4px solid #dc3545;
                        word-break: break-word;
                      "
                    >
                      {{question}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 16px 24px">
                <a
                  href="https://secretsanta.jovanilic.com/chat"
                  target="_blank"
                  style="
                    display: inline-block;
                    padding: 10px 24px;
                    background-color: #dc3545;
                    color: #ffffff;
                    text-decoration: none;
                    font-weight: bold;
                    border-radius: 4px;
                  "
                  >Open the chat</a
                >
              </td>
            </tr>
            <tr>
              <td
                style="padding: 8px 24px 20px; color: #6c757d; font-size: 13px"
              >
                The question was sent anonymously. Messages in the chat are
                visible to everyone in your group.
              </td>
            </tr>
          </table>
          <p
            style="
              margin: 16px 0 0;
              font-family: Arial, Helvetica, sans-serif;
              font-size: 14px;
              color: #212529;
            "
          >
            Merry shopping und Alles Gute zum Gechristmas.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
