services:
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${mongodbUsername}
      MONGO_INITDB_ROOT_PASSWORD: ${mongodbPassword}
    volumes:
      - ./private/mongodb/data:/data/db
    ports:
      - '27017:27017'

  # S3-compatible storage for local development and CI; the app talks to it through the minio client
  s3:
    image: adobe/s3mock:5.2.3
    restart: always
    # the bind-mounted /data is created by docker as root, so the default image user can't write to it
    user: root
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${minioBucket}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    volumes:
      - ./private/s3mock/data:/data
    ports:
      - '${minioPort}:9090'
