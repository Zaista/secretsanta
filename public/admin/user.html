<tr data-name="userRow">
  <th data-name="userIndex" scope="row" class="d-none d-sm-table-cell"></th>
  <td data-name="userEmail" class="text-break"></td>
  <td>
    <a href="#">
      <i class="bi bi-box-arrow-up-right"></i>
    </a>
    <input data-name="userId" type="hidden" />
  </td>
  <td>
    <select
      class="form-select"
      data-name="userRole"
      data-onchange="users"
      aria-label="Role"
    >
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
  </td>
  <td>
    <i
      data-name="userRemove"
      class="bi bi-trash"
      role="button"
      aria-label="Remove from group"
      data-bs-toggle="modal"
      data-bs-target="#removeUserDialog"
    ></i>
  </td>
</tr>
